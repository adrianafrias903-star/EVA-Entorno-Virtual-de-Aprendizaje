
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b18">
    <title>EVA | Entorno Virtual de Aprendizaje</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- PANTALLA DE INICIO DE SESION -->
    <section id="login-screen">
        <form id="login-form">
            <h1>🚀 EVA</h1>
            <p>ENTORNO VIRTUAL DE APRENDIZAJE</p>

            <h2>Bienvenido al futuro del aprendizaje</h2>

            <input
                type="text"
                id="username"
                placeholder="Escribe tu nombre"
                required
            >

            <button type="submit">Ingresar a EVA</button>
        </form>
    </section>

    <!-- APLICACION -->
    <div id="app" class="hidden">

        <!-- CABECERA -->
        <header class="card">
            <h1>🚀 EVA</h1>
            <p>Tu conocimiento, tu futuro.</p>
            <p>Estudiante: <span id="user-name"></span></p>
        </header>

        <!-- MENU -->
        <nav class="card">
            <button onclick="mostrarInicio()">🏠 Inicio</button>
            <button onclick="mostrarMaterias()">📚 Materias</button>
            <button onclick="mostrarProgreso()">📊 Mi progreso</button>
            <button onclick="mostrarDiplomas()">🏆 Certificados</button>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content">
        </main>

        <!-- PIE DE PAGINA -->
        <footer class="card">
            <p>© 2026 EVA - Entorno Virtual de Aprendizaje</p>
            <p>Aprende. Practica. Supera tus límites.</p>
        </footer>

    </div>

    <!-- ARCHIVOS JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="app.js"></script>

</body>
</html>
