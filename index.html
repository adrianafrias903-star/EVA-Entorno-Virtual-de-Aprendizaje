
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA | Entorno Virtual de Aprendizaje</title>
    <meta name="description" content="Plataforma educativa EVA para el aprendizaje virtual.">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- PANTALLA DE INICIO DE SESIÓN -->
    <section id="login-screen" class="login-screen">
        <div class="login-card">

            <div class="logo">EVA</div>

            <h1>Bienvenido a EVA</h1>
            <p>Entorno Virtual de Aprendizaje</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Ingresa tu nombre"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Ingresar a EVA
                </button>
            </form>

            <p class="login-footer">
                Aprende, descubre y construye tu futuro.
            </p>

        </div>
    </section>

    <!-- PLATAFORMA PRINCIPAL -->
    <div id="app" class="app hidden">

        <!-- BARRA SUPERIOR -->
        <header class="topbar">

            <div class="brand">
                <span class="brand-icon">🎓</span>
                <span>EVA</span>
            </div>

            <div class="user-info">
                <span id="user-name">Estudiante</span>
                <button id="logout-btn" class="logout-btn">
                    Cerrar sesión
                </button>
            </div>

        </header>

        <!-- MENÚ DE NAVEGACIÓN -->
        <aside class="sidebar">

            <button class="nav-btn active" data-page="home">
                🏠 Inicio
            </button>

            <button class="nav-btn" data-page="subjects">
                📚 Asignaturas
            </button>

            <button class="nav-btn" data-page="progress">
                📊 Mi progreso
            </button>

            <button class="nav-btn" data-page="diplomas">
                🏆 Certificados
            </button>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content" class="main-content">
        </main>

    </div>

    <!-- ARCHIVOS DE JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="app.js"></script>

</body>
</html>
